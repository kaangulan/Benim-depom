<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StepUp - Nike</title>

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- GOOGLE FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Poppins",sans-serif;
    }

    body{
      background:
      linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
      url("nıke/bg.jpg");

      background-size:cover;
      background-position:center;
      color:white;
      min-height:100vh;
      overflow-x:hidden;
    }

    /* NAVBAR */

    nav{
      width:100%;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:fixed;
      top:0;
      left:0;
      z-index:1000;

      background:rgba(0,0,0,.35);
      backdrop-filter:blur(12px);
    }

    .logo img{
      width:120px;
    }

    .nav-links{
      display:flex;
      gap:25px;
      align-items:center;
    }

    .nav-links a{
      color:white;
      font-size:22px;
      transition:.3s;
      text-decoration:none;
    }

    .nav-links a:hover{
      color:red;
      transform:translateY(-3px);
    }

    /* MAIN */

    .container{
      width:100%;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:120px 8% 60px;
    }

    .row{
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:60px;
      align-items:center;
    }

    /* LEFT */

    .content h1{
      font-size:70px;
      line-height:1.1;
      margin-bottom:20px;
      font-weight:700;
    }

    .content span{
      color:red;
    }

    .content p{
      font-size:15px;
      line-height:1.8;
      color:#ddd;
      margin-bottom:30px;
    }

    /* VIDEO */

    .video-box{
      width:100%;
      overflow:hidden;
      border-radius:25px;
      margin-bottom:30px;
      box-shadow:0 10px 30px rgba(0,0,0,.4);
    }

    video{
      width:100%;
      display:block;
    }

    /* PRICE */

    .price{
      display:flex;
      align-items:center;
      gap:15px;
      margin-bottom:25px;
    }

    .price h2{
      font-size:35px;
      color:red;
    }

    .price s{
      color:#aaa;
      font-size:20px;
    }

    /* BUTTONS */

    .buttons{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .buttons button,
    .buttons a{

      padding:15px 35px;
      border:none;
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-weight:600;
      cursor:pointer;
      transition:.3s;
      font-size:15px;
    }

    .cart-btn{
      background:red;
    }

    .category-btn{
      background:rgba(255,255,255,.1);
      backdrop-filter:blur(10px);
    }

    .buttons button:hover,
    .buttons a:hover{
      transform:translateY(-5px);
      box-shadow:0 8px 20px rgba(0,0,0,.4);
    }

    /* RIGHT */

    .product-box{
      position:relative;
      text-align:center;
    }

    .main-shoe{
      width:100%;
      max-width:550px;
      transform:rotate(-20deg);
      transition:.5s;
      filter:drop-shadow(0 20px 30px rgba(0,0,0,.5));

      animation:float 3s ease-in-out infinite;
    }

    .main-shoe:hover{
      transform:rotate(-8deg) scale(1.05);
    }

    /* FLOAT */

    @keyframes float{

      0%{
        transform:rotate(-20deg) translateY(0);
      }

      50%{
        transform:rotate(-20deg) translateY(-15px);
      }

      100%{
        transform:rotate(-20deg) translateY(0);
      }

    }

    /* THUMBNAILS */

    .thumbs{
      margin-top:40px;
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .thumb{
      width:100px;
      height:100px;
      border-radius:20px;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(10px);

      display:flex;
      align-items:center;
      justify-content:center;

      cursor:pointer;
      transition:.3s;
    }

    .thumb:hover{
      transform:translateY(-10px);
      background:red;
    }

    .thumb.active{
      background:red;
      transform:translateY(-10px);
      box-shadow:0 10px 25px rgba(255,0,0,.4);
    }

    .thumb img{
      width:90%;
      transform:rotate(-15deg);
    }

    /* MOBILE */

    @media(max-width:992px){

      .row{
        grid-template-columns:1fr;
        text-align:center;
      }

      .content{
        order:2;
      }

      .product-box{
        order:1;
      }

      .buttons{
        justify-content:center;
      }

      .price{
        justify-content:center;
      }

      .content h1{
        font-size:50px;
      }

      .main-shoe{
        max-width:400px;
      }

    }

    @media(max-width:768px){

      nav{
        padding:15px 5%;
      }

      .logo img{
        width:90px;
      }

      .nav-links{
        gap:18px;
      }

      .nav-links a{
        font-size:18px;
      }

      .container{
        padding:100px 5% 50px;
      }

      .content h1{
        font-size:38px;
      }

      .content p{
        font-size:14px;
      }

      .buttons button,
      .buttons a{
        width:100%;
        text-align:center;
      }

      .thumb{
        width:80px;
        height:80px;
      }

    }

  </style>
</head>

<body>

  <!-- NAVBAR -->

  <nav>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png">
      </a>
    </div>

    <div class="nav-links">

      <a href="#">
        <i class="fa-solid fa-magnifying-glass"></i>
      </a>

      <a href="Sepet.html">
        <i class="fa-solid fa-bag-shopping"></i>
      </a>

      <a href="#">
        <i class="fa-solid fa-bars"></i>
      </a>

    </div>

  </nav>

  <!-- MAIN -->

  <section class="container">

    <div class="row">

      <!-- LEFT -->

      <div class="content">

        <h1 id="productTitle">
          NIKE <br>
          <span>SPORT SHOES</span>
        </h1>

        <div class="video-box">

          <video autoplay muted loop controls playsinline>

            <source src="nıke/video.mp4" type="video/mp4">

          </video>

        </div>

        <p>

          Nike, dünyanın en ikonik spor markalarından biridir.
          Yenilikçi tasarımları, üstün konforu ve modern sokak stilini
          bir araya getirerek milyonlarca kişinin tercihi olmaktadır.

        </p>

        <div class="price">

          <h2 id="productPrice">$250</h2>

          <s>$350</s>

        </div>

        <div class="buttons">

          <button class="cart-btn" id="addToCartBtn">
            Add To Cart
          </button>

          <a href="#" class="category-btn">
            Categories
          </a>

        </div>

      </div>

      <!-- RIGHT -->

      <div class="product-box">

        <img src="nıke/logo1.png"
             class="main-shoe"
             id="mainShoe">

        <div class="thumbs">

          <div class="thumb active"
               data-img="nıke/logo1.png"
               data-title="NIKE SPORT SHOES"
               data-price="$250">

            <img src="nıke/logo1.png">

          </div>

          <div class="thumb"
               data-img="nıke/logo2.png"
               data-title="NIKE AIR MAX"
               data-price="$300">

            <img src="nıke/logo2.png">

          </div>

          <div class="thumb"
               data-img="nıke/logo3.png"
               data-title="NIKE STREET"
               data-price="$400">

            <img src="nıke/logo3.png">

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- JAVASCRIPT -->

  <script>

    // AYAKKABI DEĞİŞTİRME

    const thumbs = document.querySelectorAll(".thumb");
    const mainShoe = document.getElementById("mainShoe");
    const productTitle = document.getElementById("productTitle");
    const productPrice = document.getElementById("productPrice");

    thumbs.forEach((thumb)=>{

      thumb.addEventListener("click",()=>{

        // active class
        thumbs.forEach(t =>
        t.classList.remove("active"));

        thumb.classList.add("active");

        // image değiştir
        mainShoe.src = thumb.dataset.img;

        // title değiştir
        const newTitle =
        thumb.dataset.title;

        const titleParts =
        newTitle.split(" ");

        productTitle.innerHTML =
        `${titleParts[0]} <br>
        <span>
        ${titleParts.slice(1).join(" ")}
        </span>`;

        // price değiştir
        productPrice.innerText =
        thumb.dataset.price;

      });

    });



    // ADD TO CART

    const addToCartBtn =
    document.getElementById("addToCartBtn");

    addToCartBtn.addEventListener("click",()=>{

      const product = {

        title:
        productTitle.innerText,

        price:
        productPrice.innerText,

        image:
        mainShoe.src,

        quantity:1

      };

      // eski ürünleri al
      let cart =
      JSON.parse(localStorage.getItem("cart")) || [];

      // aynı ürün varsa artır
      const existingProduct =
      cart.find(item =>
      item.title === product.title);

      if(existingProduct){

        existingProduct.quantity++;

      } else {

        cart.push(product);

      }

      // kaydet
      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

      alert("Ürün sepete eklendi!");

    });

  </script>

</body>
</html>
