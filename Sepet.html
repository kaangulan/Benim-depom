<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StepUp | Sepetim</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>

    :root{
      --bg:#060816;
      --card:#0f172a;
      --primary:#38bdf8;
      --secondary:#8b5cf6;
      --text:#cbd5e1;
      --white:#ffffff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:
      radial-gradient(circle at top right, rgba(56,189,248,.12), transparent 25%),
      radial-gradient(circle at bottom left, rgba(139,92,246,.12), transparent 25%),
      var(--bg);

      color:white;
      min-height:100vh;
      overflow-x:hidden;
    }

    /* SCROLLBAR */

    ::-webkit-scrollbar{
      width:10px;
    }

    ::-webkit-scrollbar-thumb{
      background:linear-gradient(var(--primary),var(--secondary));
      border-radius:20px;
    }

    /* NAVBAR */

    .navbar{
      background:rgba(6,8,22,.75)!important;
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.05);
      padding:18px 0;
    }

    .navbar-brand{
      font-size:32px;
      font-weight:800;
      color:var(--primary)!important;
    }

    .back-btn{
      width:48px;
      height:48px;
      border-radius:50%;
      background:rgba(255,255,255,.05);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      text-decoration:none;
      transition:.3s;
      font-size:18px;
    }

    .back-btn:hover{
      background:linear-gradient(to right,var(--primary),var(--secondary));
      transform:translateY(-4px);
      color:white;
    }

    /* PAGE */

    .page{
      padding:140px 0 80px;
    }

    .page-title{
      margin-bottom:50px;
    }

    .page-title h1{
      font-size:60px;
      font-weight:800;
    }

    .gradient{
      background:linear-gradient(to right,var(--primary),var(--secondary));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .page-title p{
      color:var(--text);
      margin-top:10px;
      font-size:17px;
    }

    /* CART */

    .cart-items{
      display:flex;
      flex-direction:column;
      gap:25px;
    }

    .cart-item{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(14px);
      border-radius:35px;
      padding:25px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
      flex-wrap:wrap;
      transition:.4s;
      overflow:hidden;
      position:relative;
    }

    .cart-item::before{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      background:
      radial-gradient(circle,
      rgba(56,189,248,.15),
      transparent 70%);
      top:-120px;
      right:-120px;
    }

    .cart-item:hover{
      transform:translateY(-8px);
      box-shadow:0 25px 40px rgba(0,0,0,.35);
    }

    /* PRODUCT */

    .product{
      display:flex;
      align-items:center;
      gap:25px;
      flex:1;
      min-width:280px;
      z-index:2;
    }

    .product-image{
      width:150px;
      height:130px;
      border-radius:25px;
      background:rgba(255,255,255,.03);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .product-image img{
      width:85%;
      transition:.4s;
      filter:drop-shadow(0 20px 30px rgba(0,0,0,.45));
    }

    .cart-item:hover .product-image img{
      transform:scale(1.08) rotate(-5deg);
    }

    .product-info h2{
      font-size:26px;
      font-weight:700;
      margin-bottom:10px;
    }

    .product-info p{
      color:var(--text);
      line-height:1.7;
      font-size:15px;
    }

    /* PRICE */

    .price{
      font-size:30px;
      font-weight:800;
      color:var(--primary);
      min-width:120px;
      text-align:center;
      z-index:2;
    }

    /* QUANTITY */

    .quantity{
      display:flex;
      align-items:center;
      gap:15px;
      z-index:2;
    }

    .quantity button{
      width:45px;
      height:45px;
      border:none;
      border-radius:14px;
      background:
      linear-gradient(to right,var(--primary),var(--secondary));

      color:white;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      transition:.3s;
    }

    .quantity button:hover{
      transform:scale(1.1);
    }

    .quantity span{
      font-size:20px;
      font-weight:700;
      min-width:25px;
      text-align:center;
    }

    /* REMOVE */

    .remove-btn{
      border:none;
      padding:14px 22px;
      border-radius:16px;
      background:rgba(239,68,68,.15);
      color:#f87171;
      font-weight:600;
      cursor:pointer;
      transition:.3s;
      z-index:2;
    }

    .remove-btn:hover{
      background:#ef4444;
      color:white;
      transform:translateY(-3px);
    }

    /* SUMMARY */

    .summary{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(15px);
      border-radius:35px;
      padding:40px;
      position:sticky;
      top:120px;
    }

    .summary h2{
      font-size:35px;
      font-weight:800;
      margin-bottom:35px;
    }

    .summary-row{
      display:flex;
      justify-content:space-between;
      margin-bottom:22px;
      color:var(--text);
      font-size:17px;
    }

    .summary-row.total{
      margin-top:35px;
      padding-top:25px;
      border-top:1px solid rgba(255,255,255,.08);
      font-size:28px;
      font-weight:800;
      color:white;
    }

    .summary-row.total span:last-child{
      color:var(--primary);
    }

    /* BUTTON */

    .checkout-btn{
      width:100%;
      margin-top:35px;
      border:none;
      padding:18px;
      border-radius:18px;
      background:
      linear-gradient(to right,var(--primary),var(--secondary));

      color:white;
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      transition:.3s;
    }

    .checkout-btn:hover{
      transform:translateY(-5px);
      box-shadow:0 15px 30px rgba(56,189,248,.25);
    }

    /* EMPTY */

    .empty-cart{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      border-radius:35px;
      padding:80px 20px;
      text-align:center;
    }

    .empty-cart i{
      font-size:75px;
      margin-bottom:25px;
      background:
      linear-gradient(to right,var(--primary),var(--secondary));

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .empty-cart h2{
      font-size:40px;
      font-weight:800;
      margin-bottom:15px;
    }

    .empty-cart p{
      color:var(--text);
      margin-bottom:30px;
    }

    .shop-btn{
      display:inline-block;
      padding:16px 35px;
      border-radius:18px;
      text-decoration:none;
      color:white;
      font-weight:600;

      background:
      linear-gradient(to right,var(--primary),var(--secondary));

      transition:.3s;
    }

    .shop-btn:hover{
      transform:translateY(-4px);
      color:white;
    }

    /* MOBILE */

    @media(max-width:992px){

      .summary{
        margin-top:40px;
        position:static;
      }

    }

    @media(max-width:768px){

      .page{
        padding:120px 0 60px;
      }

      .page-title h1{
        font-size:42px;
      }

      .cart-item{
        flex-direction:column;
        align-items:flex-start;
      }

      .product{
        flex-direction:column;
        text-align:center;
      }

      .product-info{
        text-align:center;
      }

      .price{
        width:100%;
      }

      .quantity{
        width:100%;
        justify-content:center;
      }

      .remove-btn{
        width:100%;
      }

      .summary{
        padding:30px 25px;
      }

    }

  </style>

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar navbar-expand-lg fixed-top">

    <div class="container">

      <a class="navbar-brand" href="index.html">
        <i class="fa-solid fa-shoe-prints"></i> StepUp
      </a>

      <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

    </div>

  </nav>

  <!-- PAGE -->

  <section class="page">

    <div class="container">

      <div class="page-title">

        <h1>
          Alışveriş <span class="gradient">Sepetim</span>
        </h1>

        <p>
          Sepetindeki ürünleri düzenle ve siparişini tamamla.
        </p>

      </div>

      <div class="row g-4">

        <!-- CART ITEMS -->

        <div class="col-lg-8">

          <div class="cart-items" id="cartItems">

          </div>

        </div>

        <!-- SUMMARY -->

        <div class="col-lg-4">

          <div class="summary">

            <h2>Sipariş Özeti</h2>

            <div class="summary-row">

              <span>Ara Toplam</span>

              <span id="subTotal">$0</span>

            </div>

            <div class="summary-row">

              <span>Kargo</span>

              <span>$20</span>

            </div>

            <div class="summary-row">

              <span>İndirim</span>

              <span>-$10</span>

            </div>

            <div class="summary-row total">

              <span>Toplam</span>

              <span id="totalPrice">$0</span>

            </div>

            <button class="checkout-btn">

              <i class="fa-solid fa-credit-card"></i>
              Siparişi Tamamla

            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- JAVASCRIPT -->

  <script>

    const cartItems =
    document.getElementById("cartItems");

    let cart =
    JSON.parse(localStorage.getItem("cart")) || [];



    // SEPETİ GÖSTER

    function renderCart(){

      cartItems.innerHTML = "";

      if(cart.length === 0){

        cartItems.innerHTML = `

        <div class="empty-cart">

          <i class="fa-solid fa-cart-shopping"></i>

          <h2>Sepetiniz boş</h2>

          <p>
            Hemen premium sneaker modellerini keşfet.
          </p>

          <a href="index.html" class="shop-btn">
            Alışverişe Başla
          </a>

        </div>

        `;

        document.getElementById("totalPrice")
        .innerText = "$0";

        document.getElementById("subTotal")
        .innerText = "$0";

        return;

      }

      let total = 0;

      cart.forEach((item,index)=>{

        const itemPrice =
        parseInt(item.price.replace("$",""));

        const itemTotal =
        itemPrice * item.quantity;

        total += itemTotal;

        cartItems.innerHTML += `

        <div class="cart-item">

          <div class="product">

            <div class="product-image">

              <img src="${item.image}">

            </div>

            <div class="product-info">

              <h2>${item.title}</h2>

              <p>
                Premium sneaker koleksiyonundan seçilen özel ürün.
              </p>

            </div>

          </div>

          <div class="price">
            $${itemTotal}
          </div>

          <div class="quantity">

            <button onclick="decrease(${index})">
              -
            </button>

            <span>${item.quantity}</span>

            <button onclick="increase(${index})">
              +
            </button>

          </div>

          <button class="remove-btn"
            onclick="removeItem(${index})">

            <i class="fa-solid fa-trash"></i>
            Sil

          </button>

        </div>

        `;

      });

      const shipping = 20;
      const discount = 10;

      const finalTotal =
      total + shipping - discount;

      document.getElementById("subTotal")
      .innerText = "$" + total;

      document.getElementById("totalPrice")
      .innerText = "$" + finalTotal;

    }



    // ARTTIR

    function increase(index){

      cart[index].quantity++;

      saveCart();

    }



    // AZALT

    function decrease(index){

      if(cart[index].quantity > 1){

        cart[index].quantity--;

        saveCart();

      }

    }



    // SİL

    function removeItem(index){

      cart.splice(index,1);

      saveCart();

    }



    // KAYDET

    function saveCart(){

      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

      renderCart();

    }



    // SAYFA AÇILINCA

    renderCart();

  </script>

</body>

</html>
